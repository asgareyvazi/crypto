[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icbt"
version = "0.1.0"
description = "Independent Cryptocurrency Backtester - a self-contained spot backtesting engine with FastAPI dashboard, CLI, and NostalgiaForInfinityX8 strategy support."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "asgareyvazi"}]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
icbt = "icbt.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"icbt" = ["ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E402", "B904"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
